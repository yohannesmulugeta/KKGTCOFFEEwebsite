name: Fix transparent header logo

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/fix-header-logo.yml'

permissions:
  contents: write

jobs:
  fix-logo:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Remove white background and optimize logo
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq imagemagick webp
          convert public/media/kkgt-logo-transparent.png \
            -alpha on -fuzz 8% -transparent white \
            -trim +repage -resize 212x100 \
            /tmp/kkgt-logo-header.png
          cwebp -quiet -q 92 -alpha_q 100 /tmp/kkgt-logo-header.png -o public/media/kkgt-logo-header.webp
          test -s public/media/kkgt-logo-header.webp
          identify /tmp/kkgt-logo-header.png
          ls -lh public/media/kkgt-logo-header.webp
      - name: Commit fixed transparent logo
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add public/media/kkgt-logo-header.webp
          git diff --cached --quiet && exit 0
          git commit -m "Fix transparent KKGT header logo"
          git pull --rebase origin main
          git push

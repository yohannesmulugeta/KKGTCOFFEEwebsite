name: Build transparent header logo

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/build-header-logo.yml'

permissions:
  contents: write

jobs:
  build-logo:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Create optimized transparent WebP logo
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq webp
          cwebp -quiet -q 90 -alpha_q 100 -resize 212 100 public/media/kkgt-logo-transparent.png -o public/media/kkgt-logo-header.webp
          test -s public/media/kkgt-logo-header.webp
          file public/media/kkgt-logo-header.webp
          ls -lh public/media/kkgt-logo-header.webp
      - name: Commit optimized logo
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add public/media/kkgt-logo-header.webp
          git diff --cached --quiet && exit 0
          git commit -m "Add optimized transparent header logo"
          git pull --rebase origin main
          git push
